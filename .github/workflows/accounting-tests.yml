name: Accounting Core Tests
on:
  push:
    branches: [main, feat/accounting-core-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
