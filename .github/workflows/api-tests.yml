name: Finance API Security Tests
on:
  push:
    branches: [main, feat/authenticated-finance-read-api]
  pull_request:
    branches: [main, feat/finance-reporting-api]
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Run tenant provisioning policy tests
        run: python -m unittest discover -s tests -p 'test_erp_tenant_policy.py' -v
      - name: Test ERP control-plane registration policy
        run: python -m unittest discover -s tests -p 'test_erp_tenant_admin.py' -v
      - name: Verify isolated ERP control-plane credentials
        run: python -m unittest discover -s tests -p 'test_erp_control_plane_db.py' -v
      - name: Verify ERP control-plane gateway remains disabled
        run: python -m unittest discover -s tests -p 'test_erp_control_plane_gateway.py' -v
      - name: Run API security tests
        run: python -m unittest discover -s tests -p 'test_api.py' -v
