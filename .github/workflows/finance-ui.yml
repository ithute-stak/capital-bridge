name: Finance UI Checks
on:
  push:
    branches: [main, feat/finance-dashboard-ui]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Test realtime WebSocket refresh client
        run: |
          node --check web/realtime-refresh.js
          node tests/realtime_refresh.test.cjs
          node tests/realtime_reconnect_recovery.test.cjs
          node --check web/clients.js
          node tests/live_clients_realtime.test.cjs
      - name: Check required dashboard assets and demo warnings
        run: python -m unittest discover -s tests -p 'test_frontend.py' -v
