name: PostgreSQL Accounting Integrity
on:
  push:
    branches: [main, feat/postgres-accounting-schema]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: capitalbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capitalbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: capitalbridge_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_accounting.sql
      - name: Verify journal posting and immutability
        run: psql -v ON_ERROR_STOP=1 -f db/tests/accounting_smoke.sql
