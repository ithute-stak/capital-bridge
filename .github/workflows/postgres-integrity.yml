name: PostgreSQL Accounting Integrity
on:
  push:
    branches: [main, feat/postgres-accounting-schema, feat/tenant-isolation-security-tests]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: capitalbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capitalbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: capitalbridge_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_accounting.sql
      - name: Apply session-store migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/003_sessions.sql
      - name: Apply OIDC transaction migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/004_oidc_transactions.sql
      - name: Apply verified identity mapping migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/005_external_identities.sql
      - name: Provision restricted OIDC roles
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/006_oidc_roles.sql
      - name: Apply CRM client registry migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/007_clients.sql
      - name: Apply client-linked quotation migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/008_client_quotations.sql
      - name: Apply quotation audit-event migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/009_quotation_approval_events.sql
      - name: Apply invoices migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/010_invoices.sql
      - name: Apply payment and reconciliation migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/011_payments_reconciliation.sql
      - name: Apply receipt evidence migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/012_payment_receipts.sql
      - name: Apply bank reconciliation migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/013_bank_reconciliation.sql
      - name: Apply bank import exceptions migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/014_bank_import_exceptions.sql
      - name: Apply bank investigation audit migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/015_bank_exception_actions.sql
      - name: Apply finance outbox migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/016_finance_outbox.sql
      - name: Apply delivery lease migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/017_outbox_delivery_leases.sql
      - name: Apply finance event replay migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/018_finance_event_receipts.sql
      - name: Apply restricted Go delivery database role
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/019_go_delivery_role.sql
      - name: Verify Go replay writer privileges
        run: psql -v ON_ERROR_STOP=1 -f db/tests/go_delivery_grants.sql
      - name: Apply realtime notification journal migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/020_realtime_notifications.sql
      - name: Verify OIDC database privileges
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_role_permissions.sql
      - name: Execute OIDC role isolation checks
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_role_execution.sql
      - name: Verify real OIDC login and session lifecycle
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_lifecycle.sql
      - name: Verify invoice issuance rollback on invalid journal
        run: psql -v ON_ERROR_STOP=1 -f db/tests/invoice_posting_atomicity.sql
      - name: Verify journal posting and immutability
        run: psql -v ON_ERROR_STOP=1 -f db/tests/accounting_smoke.sql
      - name: Verify sequential tenant context isolation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/tenant_switching.sql
      - name: Verify tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/tenant_isolation.sql
