name: PostgreSQL Accounting Integrity
on:
  push:
    branches: [main, feat/postgres-accounting-schema, feat/tenant-isolation-security-tests]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: capitalbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capitalbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: capitalbridge_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_accounting.sql
      - name: Apply session-store migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/003_sessions.sql
      - name: Apply OIDC transaction migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/004_oidc_transactions.sql
      - name: Apply verified identity mapping migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/005_external_identities.sql
      - name: Provision restricted OIDC roles
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/006_oidc_roles.sql
      - name: Verify OIDC database privileges
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_role_permissions.sql
      - name: Execute OIDC role isolation checks
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_role_execution.sql
      - name: Verify real OIDC login and session lifecycle
        run: psql -v ON_ERROR_STOP=1 -f db/tests/oidc_lifecycle.sql
      - name: Verify journal posting and immutability
        run: psql -v ON_ERROR_STOP=1 -f db/tests/accounting_smoke.sql
      - name: Verify tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f db/tests/tenant_isolation.sql
