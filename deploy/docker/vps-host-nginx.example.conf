# Merge into your EXISTING host Nginx deployment after reviewing ports and TLS.
# Do not install this over the Ithute or LoanHub vhosts.
# Requires issued certificates and DNS for capitalbridge.co.ls.
server {
    listen 80;
    server_name capitalbridge.co.ls;
    return 301 https://$host$request_uri;
}
limit_req_zone $binary_remote_addr zone=cb_public_intake:10m rate=1r/m;
map $http_upgrade $cb_upgrade {
  default upgrade;
  '' close;
}
server {
    listen 443 ssl;
    server_name capitalbridge.co.ls;
    ssl_certificate /etc/letsencrypt/live/capitalbridge.co.ls/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capitalbridge.co.ls/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /api/v1/consultations {
        client_max_body_size 8k;
        limit_req zone=cb_public_intake burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8204;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8204;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cb_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
    location / {
        proxy_pass http://127.0.0.1:3204;
        proxy_set_header Host $host;
    }
}
