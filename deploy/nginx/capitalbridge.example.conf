# Example Nginx edge for CapitalBridge ONE. Review upstreams, TLS paths,
# certificates and trust boundaries before deployment; not auto-installed.
# Services MUST bind to loopback/private interfaces, never public :8200/:8201.
# This file must be included under nginx http{}; not a full nginx.conf.
# A second distributed limit is enforced by the backend Redis store.
limit_req_zone $binary_remote_addr zone=cb_intake_edge:10m rate=1r/m;
map $http_upgrade $cb_connection_upgrade {
    default upgrade;
    '' close;
}
upstream cb_finance_api { server 127.0.0.1:8200; }
upstream cb_realtime_gateway { server 127.0.0.1:8201; }

server {
    listen 80;
    server_name capitalbridge.co.ls api.capitalbridge.co.ls;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name capitalbridge.co.ls;
    ssl_certificate /etc/letsencrypt/live/capitalbridge.co.ls/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capitalbridge.co.ls/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /srv/capitalbridge/web;
    index index.html;
    location = /internal/events { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api/v1/realtime/events {
        proxy_pass https://cb_realtime_gateway;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/capitalbridge/realtime-upstream-ca.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name realtime.internal.capitalbridge.co.ls;
        proxy_set_header Host capitalbridge.co.ls;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
    }
    location ^~ /api/v1/staff/consultations/ {
        proxy_pass http://cb_finance_api;
        proxy_set_header Host capitalbridge.co.ls;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cb_connection_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /api/v1/consultations {
        client_max_body_size 8k;
        limit_req zone=cb_intake_edge burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cb_finance_api;
        proxy_set_header Host capitalbridge.co.ls;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    }
    location ^~ /api/ {
        proxy_pass http://cb_finance_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    server_name api.capitalbridge.co.ls;
    ssl_certificate /etc/letsencrypt/live/api.capitalbridge.co.ls/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.capitalbridge.co.ls/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /internal/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://cb_finance_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /health {
        proxy_pass http://cb_finance_api;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
